plugins {
	id 'base'
}

group = project.maven_group
version = project.mod_version

allprojects {
	group = rootProject.group
}

tasks.named('assemble') {
	dependsOn ':api:assemble', ':core:assemble', ':fabric:assemble', ':gpu-probe:assemble'
}

tasks.register('runCpuValidation') {
	group = 'verification'
	description = 'Runs the Fabric integration CPU validation suite.'
	dependsOn ':fabric:runCpuValidation'
}
