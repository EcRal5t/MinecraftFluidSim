plugins {
	id 'base'
}

group = project.maven_group
version = project.mod_version

allprojects {
	group = rootProject.group
}

tasks.named('assemble') {
	dependsOn ':api:assemble', ':model:assemble', ':solver:assemble', ':app:assemble',
			':core:assemble', ':fabric:assemble', ':gpu-kernel:assemble'
}

tasks.register('runHostValidation') {
	group = 'verification'
	description = 'Runs the Fabric integration host validation suite.'
	dependsOn ':fabric:runHostValidation'
}

tasks.register('runModuleValidation') {
	group = 'verification'
	description = 'Runs the loader-neutral model, solver and application ownership gates.'
	dependsOn ':model:runModelValidation', ':solver:runSolverValidation', ':app:runApplicationValidation'
}

tasks.register('verifyArchitecture') {
	group = 'verification'
	description = 'Runs the architecture dependency/size gate.'
	dependsOn ':fabric:runArchitectureValidation'
}

tasks.register('runValidation') {
	group = 'verification'
	description = 'Runs host validations, architecture.'
	// The host suite covers transactions, geometry and protocol.
	dependsOn ':fabric:runHostValidation', ':fabric:runArchitectureValidation'
}

tasks.named('check') {
	dependsOn tasks.named('runValidation')
}
