plugins {
	id 'base'
}

group = project.maven_group
version = project.mod_version

allprojects {
	group = rootProject.group
}

tasks.named('assemble') {
	dependsOn ':api:assemble', ':model:assemble', ':solver:assemble', ':app:assemble',
			':core:assemble', ':fabric:assemble', ':gpu-kernel:assemble', ':gpu-probe:assemble'
}

tasks.register('runCpuValidation') {
	group = 'verification'
	description = 'Runs the Fabric integration CPU validation suite.'
	dependsOn ':fabric:runCpuValidation'
}

tasks.register('runModuleValidation') {
	group = 'verification'
	description = 'Runs the loader-neutral model, solver and application ownership gates.'
	dependsOn ':model:runModelValidation', ':solver:runSolverValidation', ':app:runApplicationValidation'
}

tasks.register('verifyArchitecture') {
	group = 'verification'
	description = 'Runs the architecture dependency/size gate.'
	dependsOn ':fabric:runArchitectureValidation'
}

tasks.register('runValidation') {
	group = 'verification'
	description = 'Runs CPU main validations (default fast; -PcpuValidation=full for complete coverage), architecture and the GPU adapter once.'
	// The CPU suite already includes model thermal ownership, solver cut-cells and application transactions.
	dependsOn ':fabric:runCpuValidation', ':fabric:runArchitectureValidation', ':gpu-probe:runAdapterValidation'
}

tasks.named('check') {
	dependsOn tasks.named('runValidation')
}
