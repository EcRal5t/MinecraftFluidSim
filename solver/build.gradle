plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = 'mmm-solver'
}

version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	api project(':model')
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

tasks.withType(Test).configureEach {
	failOnNoDiscoveredTests = false
}

tasks.register('runSolverValidation', JavaExec) {
	group = 'verification'
	description = 'Runs the solver stage/cut-cell validation without Minecraft.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mmm.fluid.FlipCutCellValidation'
	enableAssertions = true
}

tasks.register('testJar', Jar) {
	archiveClassifier = 'tests'
	from sourceSets.test.output
	dependsOn tasks.named('testClasses')
}

configurations {
	testArtifacts {
		canBeConsumed = true
		canBeResolved = false
	}
}

artifacts {
	testArtifacts tasks.named('testJar')
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}
