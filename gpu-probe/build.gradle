plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'mmm-gpu-probe'
}

version = '0.1.17'

loom {
	mods {
		"mmm_gpu_probe" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(':gpu-kernel')
	include project(':gpu-kernel')
	compileOnly project(':fabric')
	testImplementation project(':gpu-kernel')
	testImplementation project(':fabric')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('runHeadlessGpuProbe') {
	group = 'verification'
	description = 'Runs the loader-neutral Vulkan capability probe.'
	dependsOn ':gpu-kernel:runHeadlessGpuProbe'
}

tasks.register('runGpuFlipValidation') {
	group = 'verification'
	description = 'Runs the loader-neutral 3D GPU FLIP validation suite.'
	dependsOn ':gpu-kernel:runGpuFlipValidation'
}

tasks.register('runGpuOccupancyBenchmark') {
	group = 'verification'
	description = 'Runs the loader-neutral M1 CPU/GPU break-even matrix.'
	dependsOn ':gpu-kernel:runGpuOccupancyBenchmark'
}

tasks.register('runGpuLongRunSurfaceValidation') {
	group = 'verification'
	description = 'Runs the loader-neutral long-run GPU/CPU surface gate.'
	dependsOn ':gpu-kernel:runGpuLongRunSurfaceValidation'
}

tasks.register('runAdapterValidation', JavaExec) {
	group = 'verification'
	description = 'Validates the Fabric probe command adapter shape.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mmm.gpuprobe.GpuProbeAdapterValidation'
	def adapterWorkDir = layout.buildDirectory.dir('adapter-validation-work').get().asFile
	workingDir adapterWorkDir
	doFirst { adapterWorkDir.mkdirs() }
}
