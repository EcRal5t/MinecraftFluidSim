			throw new GradleException('Pass -PgpuProbeNativesDir=<Minecraft LWJGL native directory>')
		}
		systemProperty 'org.lwjgl.librarypath', file(nativeDir).absolutePath
	}
	args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

tasks.register('runGpuLongRunSurfaceValidation', JavaExec) {
	group = 'verification'
	description = 'Runs the current-domain long-run GPU/CPU marker-distribution and edge-surface gate.'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.output + configurations.compileClasspath
	mainClass = 'cc.ecisr.mmm.gpuprobe.GpuLongRunSurfaceValidation'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	def probeWorkDir = layout.buildDirectory.dir('gpu-long-run-surface-validation-work').get().asFile
	workingDir probeWorkDir
	doFirst {
		probeWorkDir.mkdirs()
		def nativeDir = providers.gradleProperty('gpuProbeNativesDir').orNull
