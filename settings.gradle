pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your mod id.
rootProject.name = 'mmm'
include 'api', 'model', 'solver', 'application', 'core', 'fabric', 'gpu-probe-kernel', 'gpu-probe'
