registerGpuProbe(
    'runGpuLiquidMechanicalBenchmark',
    'Measures consecutive resident liquid mechanical commits with capacity, inventory transport and optional finite gas.',
    'mmm.gpu.GpuLiquidMechanicalBenchmark',
    'gpu-liquid-mechanical-work'
) { probeTask ->
    probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0'),
        providers.gradleProperty('gpuMechanicalGrids').getOrElse('32'),
        providers.gradleProperty('gpuMechanicalSamples').getOrElse('10'),
        providers.gradleProperty('gpuMechanicalWarmup').getOrElse('5'),
        providers.gradleProperty('gpuMechanicalGas').getOrElse('false'),
        providers.gradleProperty('gpuMechanicalScene').getOrElse('dam'),
        rootProject.layout.buildDirectory.file('gpu-liquid-capacity-failure.bin').get().asFile.absolutePath,
        providers.gradleProperty('gpuMechanicalGranular').getOrElse('0'),
        providers.gradleProperty('gpuMechanicalThermal').getOrElse('false'),
        providers.gradleProperty('gpuMechanicalProduction').getOrElse('false'),
        rootProject.file('fabric/src/main/resources/data/mmm/mmm').absolutePath
    probeTask.jvmArgs '-Xmx3g'
    probeTask.systemProperty 'mmm.gpuMechanicalStages', providers.gradleProperty('gpuMechanicalStages').getOrElse('false')
    if (providers.gradleProperty('gpuMechanicalJfr').getOrElse('false').toBoolean()) {
        probeTask.jvmArgs "-XX:StartFlightRecording=filename=${rootProject.layout.buildDirectory.file('gpu-liquid-mechanical.jfr').get().asFile.absolutePath},settings=profile,dumponexit=true"
    }
}

