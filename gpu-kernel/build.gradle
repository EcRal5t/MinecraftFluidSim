plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = 'mmm-gpu-kernel'
}

version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	api project(':solver')
	implementation 'org.lwjgl:lwjgl:3.4.1:unsafe'
	implementation('org.lwjgl:lwjgl-shaderc:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vma:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vulkan:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	runtimeOnly('org.lwjgl:lwjgl:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-shaderc:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-vma:3.4.1:natives-windows') { transitive = false }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

def registerGpuProbe = { String taskName, String descriptionText, String mainClassName, String workDirectoryName, Closure configureArgs ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = descriptionText
		dependsOn tasks.named('classes')
		classpath = sourceSets.main.runtimeClasspath
		mainClass = mainClassName
		jvmArgs '--enable-native-access=ALL-UNNAMED'
		def probeWorkDir = layout.buildDirectory.dir(workDirectoryName).get().asFile
		workingDir probeWorkDir
		doFirst {
			probeWorkDir.mkdirs()
			def nativeDir = providers.gradleProperty('gpuProbeNativesDir').orNull
			if (nativeDir != null && !nativeDir.isBlank()) {
				systemProperty 'org.lwjgl.librarypath', file(nativeDir).absolutePath
			}
		}
		configureArgs(delegate)
	}
}

registerGpuProbe(
	'runHeadlessGpuProbe',
	'Runs the windowless Vulkan/Shaderc/VMA compute capability probe.',
	'mmm.gpuprobe.HeadlessGpuProbeMain',
	'headless-probe-work'
) { probeTask ->
	if (providers.gradleProperty('gpuProbeDevice').isPresent()) {
		probeTask.args providers.gradleProperty('gpuProbeDevice').get()
	}
}

registerGpuProbe(
	'runGpuFlipValidation',
	'Runs the windowless 3D GPU FLIP correctness suite and current/32-cubed benchmarks.',
	'mmm.gpuprobe.GpuFlipProbeValidation',
	'gpu-flip-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	if (providers.gradleProperty('gpuProbeSkipLarge').map(String::toBoolean).getOrElse(false)) {
		probeTask.args '--skip-large'
	}
	if (providers.gradleProperty('gpuProbeSkipLong').map(String::toBoolean).getOrElse(false)) {
		probeTask.args '--skip-long'
	}
}

registerGpuProbe(
	'runGpuOccupancyBenchmark',
	'Measures the M1 CPU/GPU break-even matrix across grid, marker and fluid-cell occupancy.',
	'mmm.gpuprobe.GpuOccupancyBreakEvenValidation',
	'gpu-occupancy-benchmark-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

registerGpuProbe(
	'runGpuLongRunSurfaceValidation',
	'Runs the current-domain long-run GPU/CPU marker-distribution and edge-surface gate.',
	'mmm.gpuprobe.GpuLongRunSurfaceValidation',
	'gpu-long-run-surface-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	if (providers.gradleProperty('gpuProbeLongRunSteps').isPresent()) {
		probeTask.args providers.gradleProperty('gpuProbeLongRunSteps').get()
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}
