registerGpuProbe(
	'runGpuCurrentPhysicsValidation',
	'Runs existing complete physics scenarios with Vulkan pressure and liquid quantity computation.',
	'mmm.gpuprobe.GpuCurrentPhysicsValidation',
	'gpu-current-physics-work'
) { probeTask ->
	probeTask.dependsOn ':fabric:writeGpuPhysicsClasspath'
	probeTask.doFirst {
		probeTask.classpath += files(rootProject.file('fabric/build/gpu-physics-classpath.txt').text.split(java.util.regex.Pattern.quote(File.pathSeparator)))
	}
	probeTask.jvmArgs '-ea', '-Xmx512m'
	if (providers.gradleProperty('gpuPhysicsProfile').map(String::toBoolean).getOrElse(false)) {
		probeTask.jvmArgs "-XX:StartFlightRecording=filename=${rootProject.file('build/gpu-physics.jfr').absolutePath},settings=profile,dumponexit=true"
	}
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0'),
		providers.gradleProperty('gpuPhysicsSelection').getOrElse('activity-groups,controller-gas-lineage')
}

