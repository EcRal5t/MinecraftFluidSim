plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = 'mmm-gpu-kernel'
}

version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	api project(':solver')
	implementation 'org.lwjgl:lwjgl:3.4.1:unsafe'
	implementation('org.lwjgl:lwjgl-shaderc:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vma:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vulkan:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	runtimeOnly('org.lwjgl:lwjgl:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-shaderc:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-vma:3.4.1:natives-windows') { transitive = false }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

def registerGpuProbe = { String taskName, String descriptionText, String mainClassName, String workDirectoryName, Closure configureArgs ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = descriptionText
		dependsOn tasks.named('testClasses')
		classpath = sourceSets.test.runtimeClasspath
		mainClass = mainClassName
		jvmArgs '--enable-native-access=ALL-UNNAMED'
		def requestedDeviceName = providers.gradleProperty('gpuProbeDeviceName').orNull
		if (requestedDeviceName != null && !requestedDeviceName.isBlank()) {
			systemProperty 'mmm.gpuDeviceName', requestedDeviceName
		}
		def probeWorkDir = layout.buildDirectory.dir(workDirectoryName).get().asFile
		workingDir probeWorkDir
		doFirst {
			probeWorkDir.mkdirs()
			def nativeDir = providers.gradleProperty('gpuProbeNativesDir').orNull
			if (nativeDir != null && !nativeDir.isBlank()) {
				systemProperty 'org.lwjgl.librarypath', file(nativeDir).absolutePath
			}
		}
		configureArgs(delegate)
	}
}

