plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = 'mmm-gpu-kernel'
}

version = project.mod_version

repositories {
	mavenCentral()
}

dependencies {
	api project(':solver')
	implementation 'org.lwjgl:lwjgl:3.4.1:unsafe'
	implementation('org.lwjgl:lwjgl-shaderc:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vma:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	implementation('org.lwjgl:lwjgl-vulkan:3.4.1') { exclude group: 'org.lwjgl', module: 'lwjgl' }
	runtimeOnly('org.lwjgl:lwjgl:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-shaderc:3.4.1:natives-windows') { transitive = false }
	runtimeOnly('org.lwjgl:lwjgl-vma:3.4.1:natives-windows') { transitive = false }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

def registerGpuProbe = { String taskName, String descriptionText, String mainClassName, String workDirectoryName, Closure configureArgs ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = descriptionText
		dependsOn tasks.named('classes')
		classpath = sourceSets.main.runtimeClasspath
		mainClass = mainClassName
		jvmArgs '--enable-native-access=ALL-UNNAMED'
		def probeWorkDir = layout.buildDirectory.dir(workDirectoryName).get().asFile
		workingDir probeWorkDir
		doFirst {
			probeWorkDir.mkdirs()
			def nativeDir = providers.gradleProperty('gpuProbeNativesDir').orNull
			if (nativeDir != null && !nativeDir.isBlank()) {
				systemProperty 'org.lwjgl.librarypath', file(nativeDir).absolutePath
			}
		}
		configureArgs(delegate)
	}
}

registerGpuProbe(
	'runGpuInventoryTransportValidation',
	'Validates resident Vulkan int64 inventory gather and atomic candidate adoption.',
	'mmm.gpuprobe.GpuInventoryTransportValidation',
	'gpu-inventory-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

registerGpuProbe(
	'runHeadlessGpuProbe',
	'Runs the windowless Vulkan/Shaderc/VMA compute capability probe.',
	'mmm.gpuprobe.HeadlessGpuProbeMain',
	'headless-probe-work'
) { probeTask ->
	if (providers.gradleProperty('gpuProbeDevice').isPresent()) {
		probeTask.args providers.gradleProperty('gpuProbeDevice').get()
	}
}

registerGpuProbe(
	'runGpuFlipValidation',
	'Runs the windowless 3D GPU FLIP correctness suite and current/32-cubed benchmarks.',
	'mmm.gpuprobe.GpuFlipProbeValidation',
	'gpu-flip-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	if (providers.gradleProperty('gpuProbeSkipLarge').map(String::toBoolean).getOrElse(false)) {
		probeTask.args '--skip-large'
	}
	if (providers.gradleProperty('gpuProbeSkipLong').map(String::toBoolean).getOrElse(false)) {
		probeTask.args '--skip-long'
	}
}

registerGpuProbe(
	'runGpuOccupancyBenchmark',
	'Measures the M1 CPU/GPU break-even matrix across grid, marker and fluid-cell occupancy.',
	'mmm.gpuprobe.GpuOccupancyBreakEvenValidation',
	'gpu-occupancy-benchmark-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

registerGpuProbe(
	'runGpuLongRunSurfaceValidation',
	'Runs the current-domain long-run GPU/CPU marker-distribution and edge-surface gate.',
	'mmm.gpuprobe.GpuLongRunSurfaceValidation',
	'gpu-long-run-surface-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	if (providers.gradleProperty('gpuProbeLongRunSteps').isPresent()) {
		probeTask.args providers.gradleProperty('gpuProbeLongRunSteps').get()
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}

registerGpuProbe(
	'runGpuPressureScaleBenchmark',
	'Measures current resident pressure solver against same-CSR CPU Jacobi-PCG at 8/16/32/64 cubed.',
	'mmm.gpuprobe.GpuPressureScaleBenchmark',
	'gpu-pressure-scale-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0'),
		providers.gradleProperty('gpuPressureGridSizes').getOrElse('8,16,32,64'),
		providers.gradleProperty('gpuPressureSamples').getOrElse('3'),
		providers.gradleProperty('gpuPressureSingleGroupRows').getOrElse('16384')
	probeTask.jvmArgs '-Xmx1g'
}

registerGpuProbe(
	'runGpuPressureValidation',
	'Runs resident Vulkan pressure solves inside current finite-volume candidates.',
	'mmm.gpuprobe.GpuPressureValidation',
	'gpu-pressure-validation-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

registerGpuProbe(
	'runGpuLiquidQuantityValidation',
	'Validates actual Vulkan liquid mass and species partitions through production inventory plans.',
	'mmm.gpuprobe.GpuLiquidQuantityValidation',
	'gpu-liquid-quantity-work'
) { probeTask ->
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0')
}

registerGpuProbe(
	'runGpuCurrentPhysicsValidation',
	'Runs existing complete physics scenarios with Vulkan pressure and liquid quantity computation.',
	'mmm.gpuprobe.GpuCurrentPhysicsValidation',
	'gpu-current-physics-work'
) { probeTask ->
	probeTask.dependsOn ':fabric:writeGpuPhysicsClasspath'
	probeTask.doFirst {
		probeTask.classpath += files(rootProject.file('fabric/build/gpu-physics-classpath.txt').text.split(java.util.regex.Pattern.quote(File.pathSeparator)))
	}
	probeTask.jvmArgs '-ea', '-Xmx512m'
	if (providers.gradleProperty('gpuPhysicsProfile').map(String::toBoolean).getOrElse(false)) {
		probeTask.jvmArgs "-XX:StartFlightRecording=filename=${rootProject.file('build/gpu-physics.jfr').absolutePath},settings=profile,dumponexit=true"
	}
	probeTask.args providers.gradleProperty('gpuProbeDevice').getOrElse('0'),
		providers.gradleProperty('gpuPhysicsSelection').getOrElse('activity-groups,controller-gas-lineage')
}
