plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'mmm-fabric'
}

version = project.mod_version

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		'mmm' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
        'mmm_gametest' { sourceSet sourceSets.gametest }
	}
    runs {
        gameTest {
            server()
            source sourceSets.gametest
            name 'MMM Game Test'
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-Xmx2g'
        }
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"

	implementation project(':api')
	implementation project(':model')
	implementation project(':solver')
	implementation project(':app')
	implementation project(':gpu-kernel')
	include project(':api')
	include project(':model')
	include project(':solver')
	include project(':app')
	include project(':gpu-kernel')
	include('org.lwjgl:lwjgl:3.4.1') { transitive = false }
	include('org.lwjgl:lwjgl:3.4.1:unsafe') { transitive = false }
	include('org.lwjgl:lwjgl:3.4.1:natives-windows') { transitive = false }
	['lwjgl-vulkan', 'lwjgl-shaderc', 'lwjgl-vma'].each { module ->
		include implementation("org.lwjgl:${module}:3.4.1") { transitive = false }
	}
	['lwjgl-shaderc', 'lwjgl-vma'].each { module ->
		include("org.lwjgl:${module}:3.4.1:natives-windows") { transitive = false }
	}
	['ejml-core', 'ejml-ddense', 'ejml-dsparse'].each { module ->
		include implementation("org.ejml:${module}:${project.ejml_version}")
	}

	testImplementation project(path: ':model', configuration: 'testArtifacts')
	testImplementation project(path: ':solver', configuration: 'testArtifacts')
	testImplementation project(path: ':app', configuration: 'testArtifacts')
	testImplementation files(sourceSets.client.output)
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

tasks.withType(Test).configureEach {
	failOnNoDiscoveredTests = false
}

tasks.named('runGameTest') {
	dependsOn tasks.named('gametestClasses')
	classpath += project(':gpu-kernel').configurations.compileClasspath
}

def validationMetadataDir = layout.buildDirectory.dir('generated/validation-metadata')
def validationSources = files(
	['api', 'model', 'solver', 'app', 'gpu-kernel', 'fabric'].collect { module ->
		rootProject.fileTree(module + '/src') { exclude '**/build/**', '**/.gradle/**' }
	},
	rootProject.fileTree(rootProject.rootDir) {
		include '*.gradle', 'gradle.properties', 'api/build.gradle', 'model/build.gradle', 'solver/build.gradle', 'app/build.gradle', 'gpu-kernel/build.gradle', 'fabric/build.gradle'
	}
)
tasks.register('generateValidationMetadata') {
	inputs.files(validationSources).withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir validationMetadataDir
	outputs.upToDateWhen { false }
	doLast {
		def digest = java.security.MessageDigest.getInstance('SHA-256')
		validationSources.files.findAll { it.isFile() }.sort { it.absolutePath }.each { file ->
			digest.update(rootProject.relativePath(file).replace('\\', '/').getBytes('UTF-8'))
			file.withInputStream { stream ->
				byte[] buffer = new byte[65536]; int count
				while ((count = stream.read(buffer)) >= 0) if (count > 0) digest.update(buffer, 0, count)
			}
		}
		def info = new Properties()
		info.setProperty('workspaceRoot', rootProject.rootDir.absolutePath)
		info.setProperty('revision', providers.exec { workingDir rootProject.rootDir; commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim())
		info.setProperty('sourceSHA256', digest.digest().encodeHex().toString())
		def destination = validationMetadataDir.get().file('validation-build.properties').asFile
		destination.parentFile.mkdirs()
		destination.withOutputStream { info.store(it, 'Validation source provenance; runtime hashes the actual classpath') }
	}
}
tasks.named('processTestResources') {
	dependsOn tasks.named('generateValidationMetadata')
	from validationMetadataDir
}

tasks.register('writeGpuPhysicsClasspath') {
	dependsOn tasks.named('testClasses')
	def destination = layout.buildDirectory.file('gpu-physics-classpath.txt')
	outputs.file(destination)
	doLast {
		destination.get().asFile.text = (sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath).asPath
	}
}

tasks.register('runHostValidation', JavaExec) {
	group = 'verification'
	description = 'Runs selected host validation checks in one JVM (default: fast; use -PhostValidation=list).'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mmm.validation.HostValidationSuite'
	enableAssertions = true
	maxHeapSize = providers.gradleProperty('hostValidationHeap').getOrElse('512m')
	args providers.gradleProperty('hostValidation').getOrElse('fast')
	systemProperty 'mmm.validation.keepGoing', providers.gradleProperty('hostValidationKeepGoing').getOrElse('false')
	def validationWorkDir = layout.buildDirectory.dir('host-validation-work').get().asFile
	workingDir validationWorkDir
	doFirst {
		validationWorkDir.mkdirs()
		new File(validationWorkDir, 'classpath.txt').text = classpath.asPath
	}
}

tasks.register('runGpuProcessFlowsValidation', JavaExec) {
    group = 'verification'
    description = 'Runs actual finite-wall, gas-contact or precipitation controller processes through feed, sampling, extraction and checkpoint recovery.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mmm.simulation.GpuProcessFlowsValidation'
    jvmArgs '-ea', '--enable-native-access=ALL-UNNAMED', '-Xmx1g'
    systemProperty 'mmm.solverBackend', 'vulkan'
    systemProperty 'mmm.gpuDevice', providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	systemProperty 'mmm.gpuDeviceName', providers.gradleProperty('gpuProbeDeviceName').getOrElse('')
    def scenario = providers.gradleProperty('gpuProcessScenario').getOrElse('heat')
    args scenario, providers.gradleProperty('gpuProcessSteps').getOrElse('20')
    def workDir = layout.buildDirectory.dir("gpu-process-flows-work/${scenario}").get().asFile
    workingDir workDir
    doFirst { workDir.mkdirs() }
}

tasks.register('runGpuProductionDemoValidation', JavaExec) {
	group = 'verification'
	description = 'Runs the offline production demo through the resident Vulkan backend.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mmm.simulation.GpuProductionDemoValidation'
	jvmArgs '-ea', '--enable-native-access=ALL-UNNAMED', '-Xmx1g'
	systemProperty 'mmm.solverBackend', 'vulkan'
	systemProperty 'mmm.gpuDevice', providers.gradleProperty('gpuProbeDevice').getOrElse('0')
	systemProperty 'mmm.gpuDeviceName', providers.gradleProperty('gpuProbeDeviceName').getOrElse('')
	systemProperty 'mmm.demoLiquidDiagnostic', providers.gradleProperty('gpuDemoLiquidDiagnostic').getOrElse('false')
	args providers.gradleProperty('gpuDemo').getOrElse('demo'), providers.gradleProperty('gpuDemoSteps').getOrElse('1'), providers.gradleProperty('gpuDemoStage').getOrElse('complete')
	def workDir = layout.buildDirectory.dir('gpu-production-demo-work').get().asFile
	workingDir workDir
	doFirst {
		workDir.mkdirs()
		new File(workDir, 'classpath.txt').text = classpath.asPath
	}
}

tasks.register('runArchitectureValidation', JavaExec) {
	group = 'verification'
	description = 'Scans production sources for dependency-direction, locator, cycle and size regressions.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output
	mainClass = 'mmm.validation.ArchitectureDependencyValidation'
	enableAssertions = true
	args rootProject.projectDir.absolutePath
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}
