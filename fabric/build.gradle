plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'mmm-fabric'
}

version = project.mod_version

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		'mmm' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"

	implementation project(':api')
	implementation project(':model')
	implementation project(':solver')
	implementation project(':app')
	implementation project(':gpu-kernel')
	include project(':api')
	include project(':model')
	include project(':solver')
	include project(':app')
	include project(':gpu-kernel')
	include('org.lwjgl:lwjgl:3.4.1:unsafe') { transitive = false }
	include('org.lwjgl:lwjgl:3.4.1:natives-windows') { transitive = false }
	['lwjgl-vulkan', 'lwjgl-shaderc', 'lwjgl-vma'].each { module ->
		include("org.lwjgl:${module}:3.4.1") { transitive = false }
	}
	['lwjgl-shaderc', 'lwjgl-vma'].each { module ->
		include("org.lwjgl:${module}:3.4.1:natives-windows") { transitive = false }
	}
	['ejml-core', 'ejml-ddense', 'ejml-dsparse'].each { module ->
		include implementation("org.ejml:${module}:${project.ejml_version}")
	}

	testImplementation project(path: ':model', configuration: 'testArtifacts')
	testImplementation project(path: ':solver', configuration: 'testArtifacts')
	testImplementation project(path: ':app', configuration: 'testArtifacts')
	testImplementation files(sourceSets.client.output)
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

tasks.withType(Test).configureEach {
	failOnNoDiscoveredTests = false
}

def validationMetadataDir = layout.buildDirectory.dir('generated/validation-metadata')
tasks.register('generateValidationMetadata') {
	outputs.dir validationMetadataDir
	outputs.upToDateWhen { false }
	doLast {
		def digest = java.security.MessageDigest.getInstance('SHA-256')
		def sources = ['api', 'model', 'solver', 'app', 'fabric'].collectMany { module ->
			rootProject.fileTree(module + '/src').files.toList()
		}
		sources += rootProject.fileTree(rootProject.rootDir) { include '*.gradle', 'gradle.properties', 'api/build.gradle', 'model/build.gradle', 'solver/build.gradle', 'app/build.gradle', 'fabric/build.gradle' }.files
		sources.findAll { it.isFile() }.sort { it.absolutePath }.each { file ->
			digest.update(rootProject.relativePath(file).replace('\\', '/').getBytes('UTF-8'))
			file.withInputStream { stream ->
				byte[] buffer = new byte[65536]; int count
				while ((count = stream.read(buffer)) >= 0) if (count > 0) digest.update(buffer, 0, count)
			}
		}
		def info = new Properties()
		info.setProperty('workspaceRoot', rootProject.rootDir.absolutePath)
		info.setProperty('revision', providers.exec { workingDir rootProject.rootDir; commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim())
		info.setProperty('sourceSHA256', digest.digest().encodeHex().toString())
		def destination = validationMetadataDir.get().file('validation-build.properties').asFile
		destination.parentFile.mkdirs()
		destination.withOutputStream { info.store(it, 'Validation source provenance; runtime hashes the actual classpath') }
	}
}
tasks.named('processTestResources') {
	dependsOn tasks.named('generateValidationMetadata')
	from validationMetadataDir
}

tasks.register('writeGpuPhysicsClasspath') {
	dependsOn tasks.named('testClasses')
	def destination = layout.buildDirectory.file('gpu-physics-classpath.txt')
	outputs.file(destination)
	doLast {
		destination.get().asFile.text = (sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath).asPath
	}
}

tasks.register('runCpuValidation', JavaExec) {
	group = 'verification'
	description = 'Runs selected CPU validation gates in one JVM (default: fast; use -PcpuValidation=list).'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.validation.CpuValidationSuite'
	enableAssertions = true
	systemProperty 'mmm.solverBackend', 'cpu'
	maxHeapSize = providers.gradleProperty('cpuValidationHeap').getOrElse('512m')
	args providers.gradleProperty('cpuValidation').getOrElse('fast')
	systemProperty 'mmm.validation.keepGoing', providers.gradleProperty('cpuValidationKeepGoing').getOrElse('false')
	def validationWorkDir = layout.buildDirectory.dir('cpu-validation-work').get().asFile
	workingDir validationWorkDir
	doFirst {
		validationWorkDir.mkdirs()
		new File(validationWorkDir, 'classpath.txt').text = classpath.asPath
	}
}

['runMarkerPressureValidation': 'mmm.fluid.MarkerPressureValidation',
 'runGranularCarrierValidation': 'mmm.fluid.GranularCarrierValidation',
 'runGranularBedValidation': 'mmm.fluid.GranularBedWakeValidation',
 'runThermalValidation': 'mmm.fluid.M9ThermalValidation',
 'runCarrierMutationValidation': 'mmm.fluid.CarrierMutationValidation',
 'runLiquidTransportValidation': 'mmm.fluid.LiquidVolumeTransportValidation',
 'runRemapMomentsValidation': 'mmm.fluid.LiquidMacroscopicMotionValidation'].each { taskName, validationClass ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		description = "Runs ${validationClass} (use --args for a retained focused entry)."
		dependsOn tasks.named('testClasses')
		classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
		mainClass = validationClass
		enableAssertions = true
	}
}

tasks.register('runBoundaryPourDiagnostic', JavaExec) {
	group = 'verification'
	description = 'Replays a bounded sealed-controller pour and reports pressure work and velocity support.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.fluid.BoundaryPourDiagnostic'
	enableAssertions = true
	def diagnosticWorkDir = layout.buildDirectory.dir('boundary-pour-diagnostic').get().asFile
	workingDir diagnosticWorkDir
	doFirst { diagnosticWorkDir.mkdirs() }
}

tasks.register('runStepBenchmark', JavaExec) {
	group = 'verification'
	description = 'Measures short offline production steps; no hardware-dependent pass threshold.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.simulation.ProductionStepBenchmark'
	enableAssertions = true
	def benchmarkWorkDir = layout.buildDirectory.dir('step-benchmark-work').get().asFile
	workingDir benchmarkWorkDir
	doFirst { benchmarkWorkDir.mkdirs() }
}

tasks.register('runConvectionExperiment', JavaExec) {
	group = 'verification'
	description = 'Measures registry-derived Rayleigh growth; --verify-growth checks linear response and mesh convergence.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.fluid.LiquidConvectionExperiment'
	enableAssertions = true
}

tasks.register('runMarkerDistributionExperiment', JavaExec) {
	group = 'verification'
	description = 'Measures marker transport, solid-wall profiles, quadrature and resampling errors.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.fluid.MarkerDistributionExperiment'
	enableAssertions = true
}

tasks.register('runCompositeBenchmark', JavaExec) {
	group = 'verification'
	description = 'Measures observable composite workloads; see validation.md for scene scope.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.simulation.CompositeStepBenchmark'
	enableAssertions = true
	def scene = providers.gradleProperty('benchmarkScene').getOrElse('thermochem')
	args scene, providers.gradleProperty('benchmarkWarmup').getOrElse('20'),
		providers.gradleProperty('benchmarkSamples').getOrElse('80'),
		providers.gradleProperty('benchmarkOutput').getOrElse(rootProject.layout.buildDirectory.file("composite-profile/${scene}").get().asFile.absolutePath),
		providers.gradleProperty('benchmarkJfr').getOrElse('false')
	def benchmarkWorkDir = layout.buildDirectory.dir('step-benchmark-work').get().asFile
	workingDir benchmarkWorkDir
	doFirst { benchmarkWorkDir.mkdirs() }
}

tasks.register('runNormalPlayFuzz', JavaExec) {
	group = 'verification'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output + sourceSets.main.output + configurations.testCompileClasspath
	mainClass = 'mmm.simulation.ControllerInventoryDurabilityValidation'
	enableAssertions = true
	if (project.hasProperty('fuzzArgs')) args project.property('fuzzArgs').toString().split(',')
	def validationWorkDir = layout.buildDirectory.dir('cpu-validation-work').get().asFile
	workingDir validationWorkDir
	doFirst { validationWorkDir.mkdirs() }
}

tasks.register('runArchitectureValidation', JavaExec) {
	group = 'verification'
	description = 'Scans production sources for dependency-direction, locator, cycle and size regressions.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.output
	mainClass = 'mmm.validation.ArchitectureDependencyValidation'
	enableAssertions = true
	args rootProject.projectDir.absolutePath
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) { from components.java }
	}
}
